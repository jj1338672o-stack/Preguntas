<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Para Cami 🩷</title>
<style>
:root{--rosa:#ff6fbd;--cian:#00f2fe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
body{margin:0;padding:20px;min-height:100vh;background:#010101;color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;justify-content:center;align-items:center;text-align:center;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}

/* cielo y corazones de fondo */
#cielo{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:radial-gradient(50vmax 40vmax at 15% 20%,rgba(255,111,189,.2),transparent 70%),radial-gradient(50vmax 40vmax at 85% 80%,rgba(0,242,254,.15),transparent 70%)}
.estrella{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:brillo 3s ease-in-out infinite}
@keyframes brillo{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.4)}}
.sube{position:absolute;bottom:-50px;animation:sube linear forwards;filter:drop-shadow(0 0 8px var(--rosa));user-select:none}
@keyframes sube{to{transform:translate(var(--dx),-112vh) rotate(var(--r));opacity:0}}
.cae{position:absolute;top:-40px;animation:cae linear forwards;user-select:none}
@keyframes cae{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}

/* tarjeta con borde que gira */
.card{position:relative;z-index:10;width:min(92vw,400px);padding:34px 26px 30px;border-radius:26px;background:rgba(255,255,255,.05);backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(255,111,189,.4);animation:entra .9s cubic-bezier(.2,1.2,.4,1)}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--a),var(--cian),var(--rosa),var(--cian));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:giro 6s linear infinite;pointer-events:none}
@keyframes giro{to{--a:360deg}}
@keyframes entra{from{opacity:0;transform:translateY(30px) scale(.9)}}
.card.tiembla{animation:tiembla .6s}
@keyframes tiembla{20%{transform:translateX(-12px) rotate(-1.5deg)}40%{transform:translateX(12px) rotate(1.5deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

.corazon{background:none;border:0;padding:0;font-size:5rem;line-height:1.1;display:inline-block;animation:latido 1.2s infinite;filter:drop-shadow(0 0 15px var(--rosa))}
.corazon:focus-visible,.btn:focus-visible{outline:3px solid var(--cian);outline-offset:4px;border-radius:12px}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#susurro{min-height:1.6em;margin:2px 0 6px;font-size:1.05rem;color:#ffd3ec;text-shadow:0 0 10px var(--rosa)}
h1{font-size:2.2rem;margin:0 0 6px;min-height:1.3em;text-shadow:2px 2px 0 var(--cian),-2px -2px 0 var(--rosa)}
#sub{margin:0 0 18px;opacity:.75;font-size:.95rem}
.buttons{display:flex;justify-content:center;gap:20px;margin-top:20px}
.btn{padding:12px 32px;font-size:1.2rem;font-weight:700;border:0;border-radius:30px;transition:transform .2s,box-shadow .2s;color:#fff}
.btn:hover{transform:scale(1.1)}
.btn:active{transform:scale(.95)}
.btn-si{background:var(--rosa);color:#3b0a28;box-shadow:0 0 18px var(--rosa)}
.btn-no{background:#333;color:#ccc;box-shadow:0 0 10px rgba(255,255,255,.1)}

/* respuesta */
#resp[hidden],#foto[hidden],#medidor[hidden],#cambiar[hidden]{display:none}
.mensaje{font-size:1.45rem;line-height:1.5;margin:14px 0 0;white-space:pre-line;text-shadow:1px 1px 10px var(--rosa);min-height:3em}
.mensaje::after{content:'|';animation:parpadeo .8s infinite}
.mensaje.fin::after{content:''}
@keyframes parpadeo{50%{opacity:0}}
#foto{margin:16px auto 0;padding:10px 10px 12px;background:#fff;color:#4a1236;border-radius:10px;width:min(270px,76vw);transform:rotate(-3deg);box-shadow:0 0 28px rgba(255,111,189,.6);animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
#foto img{display:block;width:100%;height:auto;border-radius:6px}
#foto figcaption{margin-top:8px;font-size:1.02rem;font-weight:600;line-height:1.35}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(12deg)}}
#medidor{margin-top:16px}
#medidor small{opacity:.8}
.barra{height:16px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cian),var(--rosa));box-shadow:0 0 14px var(--rosa);transition:width 2.6s ease-out}
#medidor b{font-size:1.6rem;text-shadow:0 0 12px var(--rosa)}
#cambiar{margin-top:16px;font-size:1rem;padding:10px 22px}

/* efectos de clic */
.burst,.onda,.palabra{position:fixed;pointer-events:none;z-index:60;user-select:none}
.burst{animation:pop2 1.1s ease-out forwards}
@keyframes pop2{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.5);opacity:0}}
.onda{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--rosa);box-shadow:0 0 14px var(--rosa),inset 0 0 10px var(--rosa);animation:onda .75s ease-out forwards}
@keyframes onda{to{transform:scale(9);opacity:0}}
.palabra{font-weight:700;font-size:1.1rem;white-space:nowrap;text-shadow:0 0 10px var(--rosa),1px 1px 0 var(--cian);animation:palabra 1.5s ease-out forwards}
@keyframes palabra{from{transform:translate(-50%,0)}to{transform:translate(-50%,-80px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<div id="cielo" aria-hidden="true"></div>

    <button class="corazon" id="corazon" aria-label="Toca el corazón">🩷</button>

            <figcaption>Así quedó mi osito cuando dijiste que no 🥲</figcaption>
        </figure>
        <p class="mensaje" id="responseMessage"></p>
        <div id="medidor" hidden>
            <small>Nivel de amor</small>
            <div class="barra"><i></i></div>
            <b>∞%</b>
        </div>
        <button type="button" class="btn btn-si" id="cambiar" hidden>Mejor cambio mi respuesta 🩷</button>
    </div>
</div>

<script>
const $ = s => document.querySelector(s), rnd = (a,b) => Math.random()*(b-a)+a;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cielo = $('#cielo');
let escribiendo = 0;

/* estrellas */
for (let i=0;i<50;i++){const e=document.createElement('div');e.className='estrella';
  e.style.cssText=`left:${rnd(0,100)}vw;top:${rnd(0,100)}vh;animation-delay:${rnd(0,3).toFixed(1)}s`;cielo.appendChild(e);}

/* corazones flotando siempre de fondo, y lluvias especiales */
function flotar(emoji='🩷', abajo=false){
  if (reduce) return;
  const h=document.createElement('span');h.className=abajo?'cae':'sube';h.textContent=emoji;
  const d=rnd(4,7);
  h.style.cssText=`left:${rnd(2,96)}vw;font-size:${rnd(16,34)}px;--dx:${rnd(-70,70)}px;--r:${rnd(-30,30)}deg;animation-duration:${d}s`;
  cielo.appendChild(h);setTimeout(()=>h.remove(),d*1000);
}
setInterval(()=>flotar(),800);

/* efectos al dar clic */
function explotar(x,y,n=9,L=['🩷','🩷','✨','💫']){
  for(let i=0;i<n;i++){const b=document.createElement('span');b.className='burst';
    b.textContent=L[Math.floor(Math.random()*L.length)];
    b.style.cssText=`left:${x}px;top:${y}px;font-size:${rnd(16,30)}px;--dx:${rnd(-140,140)}px;--dy:${rnd(-180,60)}px;--r:${rnd(-120,120)}deg`;
    document.body.appendChild(b);setTimeout(()=>b.remove(),1200);}
}
function onda(x,y){const r=document.createElement('span');r.className='onda';r.style.left=x+'px';r.style.top=y+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),800);}
const DULCES=['te quiero','mi Cami','qué bonita','eres genial'];let clics=0;
function palabra(x,y,t){const w=document.createElement('span');w.className='palabra';
  w.textContent=(t||DULCES[Math.floor(Math.random()*DULCES.length)])+' 🩷';
  w.style.left=Math.min(Math.max(x,70),innerWidth-70)+'px';w.style.top=(y-10)+'px';
  document.body.appendChild(w);setTimeout(()=>w.remove(),1500);}
document.addEventListener('pointerdown',e=>{
  if(reduce)return;
  onda(e.clientX,e.clientY);explotar(e.clientX,e.clientY,8);
  if(++clics%3===0)palabra(e.clientX,e.clientY);
});

/* escribir letra por letra */
function escribir(el,texto,vel=45,alFinal){
  const id=++escribiendo;el.classList.remove('fin');let i=0;
  (function paso(){
    if(id!==escribiendo&&el.id==='responseMessage')return;
    el.textContent=texto.slice(0,++i);
    if(i<texto.length)setTimeout(paso,vel);else{el.classList.add('fin');if(alFinal)alFinal();}
  })();
}

/* el corazón de arriba: tócalo */
const FRASES=['Te quiero 🩷','Me haces muy feliz ✨','Eres mi persona favorita','Qué bonita eres 🥹','Gracias por existir 🌟'];
let latidos=0;
$('#corazon').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  $('#susurro').textContent=FRASES[latidos++%FRASES.length];
  explotar(r.left+r.width/2,r.top+r.height/2,12);
};

/* título al cargar */
const TITULO='¿Me amas, Cami?';
$('#questionTitle').textContent='';
setTimeout(()=>{ if(reduce)$('#questionTitle').textContent=TITULO; else escribir($('#questionTitle'),TITULO,70); },700);

function responder(opcion) {
    // Guardar el valor en el formulario
    document.getElementById('respuestaInput').value = opcion;

    // Ocultar los botones
    document.getElementById('buttonGroup').style.display = 'none';
    $('#sub').style.display = 'none';

    const msgBox = document.getElementById('responseMessage');
    $('#resp').hidden = false;

    if (opcion.includes('Sí')) {
        $('#questionTitle').textContent = "¡Sabía que sí! 🥰";
        $('#foto').hidden = true;$('#cambiar').hidden = true;
        escribir(msgBox, "Yo también te amo muchísimo, Cami 🩷\nEres mi persona favorita en todo el universo ✨", 40);
        const m = $('#medidor');m.hidden = false;
        const barra = m.querySelector('i');barra.style.width = '0';
        setTimeout(()=>{barra.style.width = '100%';}, 100);
        for (let i=0;i<6;i++) setTimeout(()=>explotar(rnd(60,innerWidth-60),rnd(100,innerHeight-100),26,['🩷','🩷','✨','🎉','💫']), i*280);
        const lluvia = setInterval(()=>flotar('🩷'), 160);
        setTimeout(()=>clearInterval(lluvia), 9000);
    } else {
        $('#questionTitle').textContent = "Aún así... 🥺";
        $('#medidor').hidden = true;
        $('#foto').hidden = false;$('#cambiar').hidden = false;
        escribir(msgBox, "¡Yo te amo con todo mi corazón! 🩷", 45);
        const c = $('#mainCard');c.classList.remove('tiembla');void c.offsetWidth;c.classList.add('tiembla');
        for (let i=0;i<14;i++) setTimeout(()=>flotar(['💔','🥺','💧'][i%3], true), i*180);
    }

    // Enviar respuesta a tu correo por detrás sin recargar la página
    const form = document.getElementById('loveForm');
    const data = new FormData(form);
    fetch(form.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
    }).catch(error => console.log(error));
}

/* si dijo que no y se arrepiente */
$('#cambiar').onclick = () => {
    escribiendo++;
    $('#resp').hidden = true;$('#foto').hidden = true;$('#cambiar').hidden = true;$('#medidor').hidden = true;
    $('#responseMessage').textContent = '';
    $('#buttonGroup').style.display = 'flex';$('#sub').style.display = '';
    $('#sub').textContent = 'piénsalo bien… 🥺';
    $('#questionTitle').textContent = TITULO;
};
</script>
</body>
</html>
